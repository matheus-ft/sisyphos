<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS uses this for the home-screen icon; it ignores the manifest's icons. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- The page's ground in each mode: --ground in src/app.css. src/ui/theme.ts rewrites them when Light or Dark is chosen. -->
    <meta name="theme-color" content="#e8c29c" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15100c" media="(prefers-color-scheme: dark)" />
    <!-- Before first paint: the lifter's Light or Dark, mirrored in localStorage by src/ui/theme.ts (the settings proper are in IndexedDB, which is asynchronous). -->
    <script>
      try {
        var theme = localStorage.getItem('sisyphos.theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
    <title>Sisyphos</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
