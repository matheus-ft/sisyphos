    <!-- Sisyphos in reserved clay: far arm, then body; each outlined in glaze. -->
    <use href="#far" fill="#f0cfa4" stroke="#15100c" stroke-width="8"/>
    <use href="#far" fill="#f0cfa4"/>
    <use href="#body" fill="#f0cfa4" stroke="#15100c" stroke-width="8"/>
    <use href="#body" fill="#f0cfa4"/>
    <!-- Hair and beard in dilute glaze; anatomy in black glaze. -->
    <g clip-path="url(#headclip)" fill="#9a5a35"><path d="M290.2,136.4L285.7,148.7L275.6,156.6L266.6,164.4L263.3,174.5L256.6,183.4L231.9,185.7L231.9,131.9Z"/><path d="M263.3,170L276.7,175.6L287.9,175.6L314.8,174.5L314.8,226L292.4,211.4L276.7,204.7L265.5,200.2L261,185.7Z"/></g>
    <g fill="none" stroke="#15100c" stroke-width="4" stroke-linecap="round">
      <path d="M274.5,183.4Q281.2,194.6 287.9,203.6M236,200Q260,192 270,222M246,228Q266,242 286,247M266,272q10,4 10,16M116,332q4,10 14,12M226,270Q206,282 200,300"/>
    </g>
    <path d="M277.8,159.9q6,-4 11,1q-6,3 -11,-1Z" fill="#15100c"/>
  </g>
</svg>
