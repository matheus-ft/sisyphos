    <g transform="translate(0 470) rotate(-26)">
      <path d="M-400,0H1000" stroke="#ee8a52" stroke-width="6"/>
      <rect x="-400" y="14" width="1400" height="31.5" fill="url(#key)"/>
      <path d="M-400,52.5H1000" stroke="#ee8a52" stroke-width="2.5"/>
    </g>
    <!-- The stone, washed in dilute glaze, with two cracks. -->
    <path d="M484.5,173.1C489.4,187.9 491.9,208.1 486.8,222.3C481.6,236.4 466.6,249.1 453.6,258C440.6,266.9 423.5,276.1 408.9,275.7C394.2,275.3 378.2,264.8 365.6,255.5C353,246.1 337.9,233.9 333.2,219.9C328.6,205.9 332.7,186.6 337.6,171.5C342.6,156.4 350.6,137.6 362.8,129.2C375,120.8 395.3,120.6 411.1,121.3C426.8,121.9 445,124.4 457.2,133.1C469.4,141.7 479.6,158.2 484.5,173.1Z" fill="url(#stone)" stroke="#15100c" stroke-width="5"/>
